<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیریت بلوک S6</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@font-face{font-family:'Vazir';src:local('Vazir');}
:root{
  --gold:#d4af37; --yellow:#ffd700; --blue:#2196f3; --bg:#0a0a0a; --card:#151515f0;
  --text:#f2e9c9;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Vazir','Tahoma',sans-serif; color:var(--text); min-height:100vh;
  background:
    linear-gradient(rgba(5,5,5,.82),rgba(10,10,15,.9)),
    radial-gradient(circle at 20% 10%, #1a1a2e 0%, #05050a 60%),
    radial-gradient(circle at 80% 90%, #2a2410 0%, #05050a 60%);
  background-attachment:fixed;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1;
  background:linear-gradient(135deg,#111 0%,#1c1c1c 40%,#2b2510 70%,#101820 100%);
  filter:blur(6px); opacity:.6;
}
.hidden{display:none!important;}
#loginScreen{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
.card{background:var(--card); border:1px solid var(--gold); border-radius:18px; padding:24px; box-shadow:0 8px 32px rgba(0,0,0,.6); animation:fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
input,select,button,textarea{font-family:inherit; font-size:15px;}
input,select,textarea{width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #444; background:#1c1c1c; color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);}
button{cursor:pointer; border:none; border-radius:10px; padding:12px 16px; margin:6px 0; font-weight:bold;
  background:linear-gradient(135deg,var(--gold),var(--yellow)); color:#111; transition:transform .15s;}
button:active{transform:scale(.96);}
button.secondary{background:linear-gradient(135deg,#1e5fa8,var(--blue)); color:#fff;}
button.danger{background:#8a1c1c; color:#fff;}
h1,h2,h3{color:var(--gold);}
#topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:linear-gradient(90deg,#111,#1a1a1a); border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:20;}
#menuBtn{background:none; font-size:26px; color:var(--yellow); padding:4px 10px;}
#dateBadge{font-size:13px; color:var(--blue); font-weight:bold;}
#drawer{position:fixed; top:0; right:-280px; width:270px; height:100%; background:#111319f5; border-left:2px solid var(--gold);
  transition:right .3s ease; z-index:30; overflow-y:auto; padding:16px;}
#drawer.open{right:0;}
#overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:25; display:none;}
#overlay.show{display:block;}
.menuItem{display:flex; align-items:center; gap:10px; padding:12px 10px; border-radius:10px; margin:4px 0; cursor:pointer; color:var(--text); font-weight:bold;}
.menuItem:hover,.menuItem.active{background:linear-gradient(90deg,#2a2410,#132238);}
.container{padding:16px; max-width:900px; margin:0 auto; animation:fadeIn .4s ease;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.fundBox{background:linear-gradient(135deg,#1b1400,#101820); border:2px solid var(--yellow); border-radius:16px; padding:22px; text-align:center; margin-bottom:16px; box-shadow:0 0 20px rgba(255,215,0,.15);}
.fundBox h2{font-size:14px; color:var(--blue);}
.fundBox .amount{font-size:32px; color:var(--yellow); font-weight:bold; margin-top:6px;}
.unitCard{background:var(--card); border:1px solid #333; border-right:4px solid var(--gold); border-radius:12px; padding:12px; margin:10px 0;}
.unitCard b{color:var(--yellow);}
table{width:100%; border-collapse:collapse; margin-top:10px; font-size:14px;}
th,td{border:1px solid #333; padding:8px; text-align:center;}
th{background:#1a1a1a; color:var(--gold);}
.row{display:flex; gap:8px;}
.row>*{flex:1;}
canvas.chartCanvas{background:#0d0d0d; border-radius:12px; padding:8px; margin:10px 0;}
.welcome{font-size:15px; margin-bottom:10px; color:var(--blue);}
.emoji{font-size:18px;}
.tag{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:bold;}
.tag.settled{background:#1f5c2d; color:#bfffc6;}
.tag.pending{background:#5c1f1f; color:#ffc6c6;}
.section-title{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.thumb{width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--gold);}
.minutesCard{display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid #333; border-radius:10px; padding:8px; margin:8px 0;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="card" style="width:100%; max-width:360px;">
    <h1 style="text-align:center;">🏢 مدیریت بلوک S6</h1>
    <p class="welcome" style="text-align:center;">به پنل مدیریت خوش آمدید ✨</p>
    <input id="loginUser" placeholder="نام کاربری">
    <input id="loginPass" type="password" placeholder="رمز عبور">
    <button onclick="doLogin()">🔐 ورود</button>
    <div id="loginErr" style="color:#ff6b6b; text-align:center; margin-top:8px;"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="topbar">
    <button id="menuBtn" onclick="toggleDrawer()">☰</button>
    <div id="dateBadge"></div>
    <div style="font-weight:bold; color:var(--gold);">S6</div>
  </div>

  <div id="overlay" onclick="toggleDrawer()"></div>
  <div id="drawer">
    <h3 style="margin-bottom:14px;">📋 منوی اصلی</h3>
    <div class="menuItem" onclick="showPage('dashboard')">📊 داشبورد مالی</div>
    <div class="menuItem" onclick="showPage('units')">🏠 ثبت و ویرایش واحدها</div>
    <div class="menuItem" onclick="showPage('entry')">💰 ثبت بدهی و واریزی</div>
    <div class="menuItem" onclick="showPage('debts')">🧾 مدیریت بدهی‌ها</div>
    <div class="menuItem" onclick="showPage('group')">👥 شارژ گروهی</div>
    <div class="menuItem" onclick="showPage('reports')">📑 گزارش‌گیری</div>
    <div class="menuItem" onclick="showPage('sync')">🔄 همگام‌سازی صندوق</div>
    <div class="menuItem" onclick="showPage('plans')">🗓️ برنامه‌های آینده</div>
    <div class="menuItem" onclick="showPage('minutes')">📝 صورت‌جلسه‌ها</div>
    <div class="menuItem" onclick="logout()">🚪 خروج</div>
  </div>

  <div class="container" id="pageContainer"></div>
</div>

<script>
/* ---------- DATA LAYER ---------- */
const DB_KEY='s6_data_v1';
function loadDB(){
  let d=localStorage.getItem(DB_KEY);
  if(!d){
    d={units:[], entries:[], fund:0, plans:[], minutes:[]};
    saveDB(d);
  } else d=JSON.parse(d);
  return d;
}
function saveDB(d){ localStorage.setItem(DB_KEY, JSON.stringify(d)); }
let DB = loadDB();
function fmt(n){ n=Number(n||0); return n.toLocaleString('en-US')+' تومان'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ---------- AUTH ---------- */
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  if(u==='DARIOSHEI1009' && p==='GANAWA98'){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('dateBadge').textContent='📅 '+todayStr();
    showPage('dashboard');
  } else {
    document.getElementById('loginErr').textContent='نام کاربری یا رمز عبور اشتباه است ❌';
  }
}
function logout(){ location.reload(); }
function toggleDrawer(){
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

/* ---------- ROUTER ---------- */
function showPage(name){
  toggleDrawer && document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  const c=document.getElementById('pageContainer');
  c.innerHTML='';
  ({
    dashboard: renderDashboard, units: renderUnits, entry: renderEntry,
    debts: renderDebts, group: renderGroup, reports: renderReports,
    sync: renderSync, plans: renderPlans, minutes: renderMinutes
  }[name])(c);
}

/* ---------- HELPERS: per-unit totals ---------- */
function unitTotals(unitNo){
  let debt=0, deposit=0;
  DB.entries.filter(e=>e.unit==unitNo).forEach(e=>{
    debt += Number(e.ownerDebt||0)+Number(e.tenantDebt||0);
    deposit += Number(e.ownerDeposit||0)+Number(e.tenantDeposit||0);
    debt -= (Number(e.ownerDeposit||0)+Number(e.tenantDeposit||0))*0; // deposits don't auto-clear debt unless settled manually
  });
  // settle status per entry recorded separately (settled flag)
  let settled = DB.entries.filter(e=>e.unit==unitNo && e.settled).reduce((s,e)=>s+Number(e.ownerDebt||0)+Number(e.tenantDebt||0),0);
  return {debt: debt-settled, deposit};
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(c){
  c.innerHTML = `
    <p class="welcome">👋 خوش آمدید، مدیر بلوک S6</p>
    <div class="fundBox"><h2>💵 موجودی صندوق</h2><div class="amount">${fmt(DB.fund)}</div></div>
    <div class="section-title"><h3>🏠 وضعیت واحدها</h3></div>
    <div id="unitsList"></div>
    <div class="section-title"><h3>📈 نمودار واریزی‌ها</h3></div>
    <canvas class="chartCanvas" id="depChart" height="180"></canvas>
    <button class="secondary" onclick="downloadChart('depChart','pdf')">⬇️ دانلود PDF</button>
    <button class="secondary" onclick="downloadChart('depChart','jpeg')">⬇️ دانلود JPEG</button>
    <div class="section-title"><h3>📉 نمودار بدهی‌ها</h3></div>
    <canvas class="chartCanvas" id="debtChart" height="180"></canvas>
    <button class="secondary" onclick="downloadChart('debtChart','pdf')">⬇️ دانلود PDF</button>
    <button class="secondary" onclick="downloadChart('debtChart','jpeg')">⬇️ دانلود JPEG</button>
  `;
  const list=document.getElementById('unitsList');
  if(DB.units.length===0) list.innerHTML='<p>هنوز واحدی ثبت نشده است.</p>';
  DB.units.forEach(u=>{
    const t=unitTotals(u.no);
    list.innerHTML += `<div class="unitCard">
      <b>واحد ${u.no}</b> — 👤 مالک: ${u.owner||'-'} | 🧑 مستاجر: ${u.tenant||'-'}<br>
      ☎️ ${u.ownerPhone||'-'} / ${u.tenantPhone||'-'}<br>
      🔴 بدهی: ${fmt(t.debt)} &nbsp; 🟢 واریزی: ${fmt(t.deposit)}
    </div>`;
  });
  const labels=DB.units.map(u=>'واحد '+u.no);
  const deps=DB.units.map(u=>unitTotals(u.no).deposit);
  const debts=DB.units.map(u=>unitTotals(u.no).debt);
  new Chart(document.getElementById('depChart'),{type:'bar',data:{labels,datasets:[{label:'واریزی',data:deps,backgroundColor:'#2196f3'}]},options:{plugins:{legend:{labels:{color:'#f2e9c9'}}},scales:{x:{ticks:{color:'#f2e9c9'}},y:{ticks:{color:'#f2e9c9'}}}}});
  new Chart(document.getElementById('debtChart'),{type:'bar',data:{labels,datasets:[{label:'بدهی',data:debts,backgroundColor:'#d4af37'}]},options:{plugins:{legend:{labels:{color:'#f2e9c9'}}},scales:{x:{ticks:{color:'#f2e9c9'}},y:{ticks:{color:'#f2e9c9'}}}}});
}
function downloadChart(id,type){
  const canvas=document.getElementById(id);
  if(type==='jpeg'){
    const a=document.createElement('a'); a.href=canvas.toDataURL('image/jpeg',1.0); a.download=id+'.jpeg'; a.click();
  } else {
    const {jsPDF}=window.jspdf; const pdf=new jsPDF();
    pdf.addImage(canvas.toDataURL('image/jpeg',1.0),'JPEG',10,10,180,90);
    pdf.save(id+'.pdf');
  }
}

/* ---------- UNITS ---------- */
function renderUnits(c){
  c.innerHTML=`
    <h2>🏠 ثبت و ویرایش واحدها</h2>
    <div class="card">
      <input id="u_no" placeholder="شماره واحد">
      <input id="u_owner" placeholder="نام مالک">
      <input id="u_tenant" placeholder="نام مستاجر">
      <input id="u_ownerPhone" placeholder="تلفن مالک">
      <input id="u_tenantPhone" placeholder="تلفن مستاجر">
      <input id="u_charge" placeholder="شارژ بر متر (تومان)">
      <button onclick="saveUnit()">💾 ذخیره واحد</button>
    </div>
    <div id="unitTableWrap"></div>
  `;
  renderUnitTable();
}
function renderUnitTable(){
  let rows=DB.units.map((u,i)=>`<tr>
    <td>${u.no}</td><td>${u.owner||''}</td><td>${u.tenant||''}</td>
    <td>${u.ownerPhone||''}</td><td>${u.tenantPhone||''}</td><td>${fmt(u.charge)}</td>
    <td>
      <button onclick="editUnit(${i})">✏️</button>
      <button class="danger" onclick="deleteUnit(${i})">🗑️</button>
    </td></tr>`).join('');
  document.getElementById('unitTableWrap').innerHTML=`
    <table><tr><th>واحد</th><th>مالک</th><th>مستاجر</th><th>تلفن مالک</th><th>تلفن مستاجر</th><th>شارژ/متر</th><th></th></tr>${rows}</table>`;
}
function saveUnit(){
  const no=document.getElementById('u_no').value.trim();
  if(!no) return alert('شماره واحد را وارد کنید');
  let existing=DB.units.find(u=>u.no===no);
  const data={no, owner:document.getElementById('u_owner').value, tenant:document.getElementById('u_tenant').value,
    ownerPhone:document.getElementById('u_ownerPhone').value, tenantPhone:document.getElementById('u_tenantPhone').value,
    charge:document.getElementById('u_charge').value};
  if(existing) Object.assign(existing,data); else DB.units.push(data);
  saveDB(DB); renderUnits(document.getElementById('pageContainer'));
}
function editUnit(i){
  const u=DB.units[i];
  document.getElementById('u_no').value=u.no;
  document.getElementById('u_owner').value=u.owner;
  document.getElementById('u_tenant').value=u.tenant;
  document.getElementById('u_ownerPhone').value=u.ownerPhone;
  document.getElementById('u_tenantPhone').value=u.tenantPhone;
  document.getElementById('u_charge').value=u.charge;
}
function deleteUnit(i){ if(confirm('حذف شود؟')){ DB.units.splice(i,1); saveDB(DB); renderUnits(document.getElementById('pageContainer')); } }

/* ---------- ENTRY (debt/deposit/repair) ---------- */
function renderEntry(c){
  const opts=DB.units.map(u=>`<option value="${u.no}">واحد ${u.no}</option>`).join('');
  c.innerHTML=`
    <h2>💰 ثبت بدهی و واریزی</h2>
    <div class="card">
      <select id="e_unit">${opts}</select>
      <input id="e_date" type="date" value="${todayStr()}">
      <div class="row"><input id="e_ownerDebt" placeholder="بدهی مالک"><input id="e_tenantDebt" placeholder="بدهی مستاجر"></div>
      <div class="row"><input id="e_ownerDeposit" placeholder="واریزی مالک"><input id="e_tenantDeposit" placeholder="واریزی مستاجر"></div>
      <input id="e_repair" placeholder="هزینه تعمیرات (از صندوق کسر می‌شود)">
      <button onclick="saveEntry()">💾 ثبت</button>
    </div>
  `;
}
function saveEntry(){
  const unit=document.getElementById('e_unit').value;
  if(!unit) return alert('ابتدا یک واحد ثبت کنید');
  const e={
    unit, date:document.getElementById('e_date').value||todayStr(),
    ownerDebt:+document.getElementById('e_ownerDebt').value||0,
    tenantDebt:+document.getElementById('e_tenantDebt').value||0,
    ownerDeposit:+document.getElementById('e_ownerDeposit').value||0,
    tenantDeposit:+document.getElementById('e_tenantDeposit').value||0,
    settled:false
  };
  const repair=+document.getElementById('e_repair').value||0;
  DB.entries.push(e);
  DB.fund += e.ownerDeposit + e.tenantDeposit - repair;
  saveDB(DB);
  alert('ثبت شد ✅');
  showPage('entry');
}

/* ---------- DEBTS ---------- */
function renderDebts(c){
  const opts=`<option value="">همه واحدها</option>`+DB.units.map(u=>`<option value="${u.no}">واحد ${u.no}</option>`).join('');
  c.innerHTML=`<h2>🧾 مدیریت بدهی‌ها</h2><select id="d_filter" onchange="renderDebtList()">${opts}</select><div id="debtList"></div>`;
  renderDebtList();
}
function renderDebtList(){
  const f=document.getElementById('d_filter').value;
  let rows='';
  DB.entries.forEach((e,i)=>{
    if(f && e.unit!=f) return;
    const total=e.ownerDebt+e.tenantDebt;
    if(total<=0) return;
    rows+=`<div class="unitCard">
      واحد ${e.unit} — 📅 ${e.date} — بدهی: ${fmt(total)}
      <span class="tag ${e.settled?'settled':'pending'}">${e.settled?'تسویه شده':'در انتظار'}</span><br>
      <button onclick="settleDebt(${i})">✅ تسویه شد</button>
      <button class="danger" onclick="deleteDebt(${i})">🗑️ حذف بدهی</button>
    </div>`;
  });
  document.getElementById('debtList').innerHTML=rows||'<p>بدهی‌ای یافت نشد.</p>';
}
function settleDebt(i){ DB.entries[i].settled=true; saveDB(DB); renderDebtList(); }
function deleteDebt(i){ if(confirm('حذف شود؟')){ DB.entries.splice(i,1); saveDB(DB); renderDebtList(); } }

/* ---------- GROUP CHARGE ---------- */
function renderGroup(c){
  c.innerHTML=`
    <h2>👥 شارژ گروهی پیشرفته</h2>
    <div class="card">
      <h3>روش ۱: بر اساس شارژ ثبت‌شده هر واحد</h3>
      <input id="g_note1" placeholder="توضیحات (مثلاً شارژ مهرماه)">
      <button onclick="applyPerUnitCharge()">اعمال بر اساس شارژ هر واحد</button>
    </div>
    <div class="card">
      <h3>روش ۲: مبلغ ثابت برای همه</h3>
      <input id="g_amount" placeholder="مبلغ ثابت">
      <input id="g_note2" placeholder="توضیحات">
      <button class="secondary" onclick="applyFlatCharge()">اعمال مبلغ ثابت برای همه</button>
    </div>
  `;
}
function applyPerUnitCharge(){
  const note=document.getElementById('g_note1').value;
  DB.units.forEach(u=>{
    DB.entries.push({unit:u.no, date:todayStr(), ownerDebt:+u.charge||0, tenantDebt:0, ownerDeposit:0, tenantDeposit:0, settled:false, note});
  });
  saveDB(DB); alert('شارژ گروهی اعمال شد ✅');
}
function applyFlatCharge(){
  const amt=+document.getElementById('g_amount').value||0;
  const note=document.getElementById('g_note2').value;
  DB.units.forEach(u=>{
    DB.entries.push({unit:u.no, date:todayStr(), ownerDebt:amt, tenantDebt:0, ownerDeposit:0, tenantDeposit:0, settled:false, note});
  });
  saveDB(DB); alert('شارژ گروهی اعمال شد ✅');
}

/* ---------- REPORTS ---------- */
function renderReports(c){
  c.innerHTML=`
    <h2>📑 گزارش‌گیری</h2>
    <div class="card">
      <input id="r_from" type="date"><input id="r_to" type="date">
      <input id="r_keyword" placeholder="جستجو بر اساس واحد یا کلمه">
      <button onclick="runReport()">🔍 اجرای گزارش</button>
    </div>
    <div id="reportOut"></div>
    <button class="secondary" onclick="exportReport('jpeg')">⬇️ دانلود JPEG</button>
    <button class="secondary" onclick="exportReport('pdf')">⬇️ دانلود PDF</button>
  `;
}
function runReport(){
  const from=document.getElementById('r_from').value, to=document.getElementById('r_to').value;
  const kw=document.getElementById('r_keyword').value.trim();
  let rows=DB.entries.filter(e=>{
    if(from && e.date<from) return false;
    if(to && e.date>to) return false;
    if(kw && !(String(e.unit).includes(kw) || (e.note||'').includes(kw))) return false;
    return true;
  });
  let html='<table><tr><th>واحد</th><th>تاریخ</th><th>بدهی مالک</th><th>بدهی مستاجر</th><th>واریزی مالک</th><th>واریزی مستاجر</th><th>یادداشت</th></tr>';
  rows.forEach(e=>{ html+=`<tr><td>${e.unit}</td><td>${e.date}</td><td>${fmt(e.ownerDebt)}</td><td>${fmt(e.tenantDebt)}</td><td>${fmt(e.ownerDeposit)}</td><td>${fmt(e.tenantDeposit)}</td><td>${e.note||''}</td></tr>`; });
  html+='</table>';
  document.getElementById('reportOut').innerHTML=html;
}
function exportReport(type){
  const el=document.getElementById('reportOut');
  html2canvas(el,{backgroundColor:'#0a0a0a'}).then(canvas=>{
    if(type==='jpeg'){ const a=document.createElement('a'); a.href=canvas.toDataURL('image/jpeg',1.0); a.download='report.jpeg'; a.click(); }
    else { const {jsPDF}=window.jspdf; const pdf=new jsPDF(); pdf.addImage(canvas.toDataURL('image/jpeg',1.0),'JPEG',10,10,190,0); pdf.save('report.pdf'); }
  });
}

/* ---------- FUND SYNC ---------- */
function renderSync(c){
  c.innerHTML=`
    <h2>🔄 همگام‌سازی صندوق</h2>
    <div class="card">
      <p>موجودی فعلی: <b>${fmt(DB.fund)}</b></p>
      <input id="s_amount" placeholder="مبلغ جدید صندوق">
      <button onclick="syncFund()">💾 به‌روزرسانی</button>
    </div>
  `;
}
function syncFund(){ DB.fund=+document.getElementById('s_amount').value||0; saveDB(DB); showPage('sync'); }

/* ---------- PLANS ---------- */
function renderPlans(c){
  c.innerHTML=`
    <h2>🗓️ برنامه‌های آینده</h2>
    <div class="card">
      <input id="p_title" placeholder="عنوان برنامه">
      <select id="p_priority"><option>بالا</option><option>متوسط</option><option>پایین</option></select>
      <input id="p_cost" placeholder="هزینه تخمینی">
      <input id="p_date" type="date">
      <button onclick="addPlan()">➕ افزودن</button>
    </div>
    <div id="planList"></div>
  `;
  renderPlanList();
}
function addPlan(){
  DB.plans.push({title:document.getElementById('p_title').value, priority:document.getElementById('p_priority').value,
    cost:document.getElementById('p_cost').value, date:document.getElementById('p_date').value});
  saveDB(DB); renderPlans(document.getElementById('pageContainer'));
}
function renderPlanList(){
  const sorted=[...DB.plans].sort((a,b)=>({بالا:0,متوسط:1,پایین:2}[a.priority]-{بالا:0,متوسط:1,پایین:2}[b.priority]));
  document.getElementById('planList').innerHTML=sorted.map((p,i)=>`
    <div class="unitCard">📌 ${p.title} — اولویت: ${p.priority} — 💰 ${fmt(p.cost)} — 📅 ${p.date}
      <button class="danger" onclick="delPlan(${DB.plans.indexOf(p)})">🗑️</button>
    </div>`).join('') || '<p>برنامه‌ای ثبت نشده.</p>';
}
function delPlan(i){ DB.plans.splice(i,1); saveDB(DB); renderPlans(document.getElementById('pageContainer')); }

/* ---------- MEETING MINUTES ---------- */
function renderMinutes(c){
  c.innerHTML=`
    <h2>📝 صورت‌جلسه‌ها</h2>
    <div class="card">
      <input id="m_no" placeholder="شماره ثبت">
      <input id="m_date" type="date" value="${todayStr()}">
      <input id="m_file" type="file" accept="image/*">
      <button onclick="addMinute()">📤 آپلود</button>
    </div>
    <div id="minutesList"></div>
  `;
  renderMinutesList();
}
function addMinute(){
  const file=document.getElementById('m_file').files[0];
  const no=document.getElementById('m_no').value, date=document.getElementById('m_date').value||todayStr();
  if(!file) return alert('یک تصویر انتخاب کنید');
  const reader=new FileReader();
  reader.onload=function(ev){
    DB.minutes.push({no,date,img:ev.target.result});
    saveDB(DB); renderMinutes(document.getElementById('pageContainer'));
  };
  reader.readAsDataURL(file);
}
function renderMinutesList(){
  document.getElementById('minutesList').innerHTML=DB.minutes.map((m,i)=>`
    <div class="minutesCard">
      <img class="thumb" src="${m.img}">
      <div>شماره: ${m.no} — 📅 ${m.date}</div>
      <button class="danger" onclick="delMinute(${i})">🗑️</button>
    </div>`).join('') || '<p>صورت‌جلسه‌ای ثبت نشده.</p>';
}
function delMinute(i){ DB.minutes.splice(i,1); saveDB(DB); renderMinutes(document.getElementById('pageContainer')); }
</script>
</body>
