<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>پنل مدیریت بلوک S6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --blue-deep:#0F3D91;
  --blue:#1D5FD6;
  --blue-soft:#EAF1FF;
  --white:#FFFFFF;
  --yellow:#F5B301;
  --yellow-soft:#FFF6DD;
  --red:#E11D2E;
  --red-soft:#FDE8E9;
  --green:#1E9E5A;
  --green-soft:#E6F7ED;
  --ink:#122036;
  --ink-soft:#5B6B85;
  --line:#DDE6F5;
  --radius:16px;
  --shadow:0 10px 30px rgba(15,61,145,.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Vazirmatn', Tahoma, sans-serif;
  background:linear-gradient(180deg,var(--blue-soft) 0%, #F4F8FF 40%, #FFFFFF 100%);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer; border:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--blue); border-radius:8px;}

/* ---------- LOGIN ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px; position:relative; overflow:hidden;
}
#loginScreen::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(29,95,214,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(245,179,1,.18), transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(225,29,46,.10), transparent 35%);
  animation:floatBg 12s ease-in-out infinite alternate;
}
@keyframes floatBg{ from{transform:scale(1) translateY(0);} to{transform:scale(1.08) translateY(-10px);} }
.login-card{
  position:relative; z-index:2;
  width:100%; max-width:400px;
  background:var(--white);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:36px 30px;
  text-align:center;
  animation:cardIn .6s cubic-bezier(.2,.9,.25,1);
  border-top:5px solid var(--blue);
}
@keyframes cardIn{ from{opacity:0; transform:translateY(24px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
.login-badge{
  width:64px; height:64px; border-radius:18px; margin:0 auto 14px;
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  display:flex; align-items:center; justify-content:center;
  font-size:26px; color:#fff; font-weight:800;
  box-shadow:0 8px 20px rgba(29,95,214,.35);
}
.login-card h1{font-size:19px; font-weight:800; color:var(--blue-deep); margin-bottom:4px;}
.login-card p.sub{color:var(--ink-soft); font-size:13px; margin-bottom:22px;}
.field{text-align:right; margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input{
  width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
  background:#F8FAFF; font-size:14px; color:var(--ink); transition:.2s;
}
.field input:focus{outline:none; border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(29,95,214,.12);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:12px; font-weight:700; font-size:14px;
  transition:.2s transform, .2s box-shadow, .2s background;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; width:100%; box-shadow:0 8px 18px rgba(29,95,214,.3);}
.btn-primary:hover{box-shadow:0 10px 24px rgba(29,95,214,.4);}
.btn-ghost{background:transparent; color:var(--blue); font-size:12.5px; margin-top:14px; text-decoration:underline;}
.login-error{color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; font-weight:600;}

/* change-credentials mini panel */
.cred-panel{display:none; text-align:right; margin-top:16px; border-top:1px dashed var(--line); padding-top:16px;}
.cred-panel.show{display:block; animation:cardIn .3s;}

/* ---------- APP SHELL ---------- */
#app{display:none; min-height:100vh;}
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; background:rgba(255,255,255,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .title{font-weight:800; color:var(--blue-deep); font-size:15px;}
.topbar .date{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.hamburger{
  width:42px; height:42px; border-radius:12px; background:var(--blue-soft);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  transition:.2s;
}
.hamburger:hover{background:var(--blue); }
.hamburger span{width:20px; height:2.4px; background:var(--blue-deep); border-radius:2px; transition:.2s;}
.hamburger:hover span{background:#fff;}

.page{padding:16px; max-width:960px; margin:0 auto; animation:fadeUp .35s ease;}
@keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* dashboard hero */
.hero{
  position:relative; border-radius:22px; overflow:hidden; padding:26px 20px;
  background:linear-gradient(135deg, var(--blue-deep), var(--blue) 60%, #2E76F5);
  color:#fff; margin-bottom:18px; box-shadow:var(--shadow);
}
.hero .bld{position:absolute; inset:0; opacity:.16; pointer-events:none;}
.hero h2{font-size:14px; opacity:.85; font-weight:600;}
.hero .balance{font-size:30px; font-weight:800; margin-top:6px; letter-spacing:.5px;}
.hero .balance small{font-size:13px; font-weight:600; opacity:.8; margin-right:4px;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
@media (max-width:640px){.grid2{grid-template-columns:1fr;}}
.card{
  background:var(--white); border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow); border:1px solid var(--line);
}
.card h3{font-size:13.5px; color:var(--blue-deep); font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
.card h3 button{font-size:11px; background:var(--blue-soft); color:var(--blue-deep); padding:6px 10px; border-radius:8px; font-weight:700;}
.card h3 button:hover{background:var(--blue); color:#fff;}
canvas{max-height:230px;}

/* drawer */
.overlay{position:fixed; inset:0; background:rgba(10,20,40,.45); opacity:0; pointer-events:none; transition:.25s; z-index:40;}
.overlay.show{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; bottom:0; right:-320px; width:300px; max-width:85vw;
  background:var(--white); z-index:50; box-shadow:-10px 0 30px rgba(0,0,0,.15);
  transition:right .3s cubic-bezier(.2,.9,.25,1); display:flex; flex-direction:column; padding:18px 14px;
}
.drawer.open{right:0;}
.drawer .dhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.drawer .dhead .lbl{font-weight:800; color:var(--blue-deep); font-size:14px;}
.drawer .close-x{width:32px; height:32px; border-radius:8px; background:var(--red-soft); color:var(--red); font-weight:800;}
.menu-item{
  display:flex; align-items:center; gap:10px; padding:12px 12px; border-radius:12px;
  font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:4px; background:transparent;
  transition:.15s; text-align:right; width:100%;
}
.menu-item .ic{width:30px; height:30px; border-radius:9px; background:var(--blue-soft); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
.menu-item:hover{background:var(--blue-soft);}
.menu-item.danger .ic{background:var(--red-soft); color:var(--red);}
.menu-item.danger{color:var(--red);}

/* forms */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:600px){.form-grid{grid-template-columns:1fr;}}
.form-grid .full{grid-column:1/-1;}
.seg{display:flex; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
.seg button{
  flex:1; padding:10px; border-radius:10px; background:#F1F5FC; color:var(--ink-soft); font-weight:700; font-size:12.5px; min-width:90px;
  border:1.5px solid transparent; transition:.15s;
}
.seg button.active{background:var(--blue); color:#fff; box-shadow:0 6px 14px rgba(29,95,214,.3);}
.seg button.active.red{background:var(--red); box-shadow:0 6px 14px rgba(225,29,46,.3);}
.seg button.active.green{background:var(--green); box-shadow:0 6px 14px rgba(30,158,90,.3);}
.seg button.active.yellow{background:var(--yellow); color:#7a5200; box-shadow:0 6px 14px rgba(245,179,1,.3);}

.list-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.list-table th{background:var(--blue-soft); color:var(--blue-deep); padding:9px 8px; text-align:right; font-weight:700; position:sticky; top:0;}
.list-table td{padding:9px 8px; border-bottom:1px solid var(--line);}
.list-table tr.debt td.tag{color:var(--red); font-weight:700;}
.list-table tr.deposit td.tag{color:var(--green); font-weight:700;}
.list-table tr.repair td.tag{color:#8a6a00; font-weight:700;}
.list-table tr.debt{background:var(--red-soft);}
.list-table tr.deposit{background:var(--green-soft);}
.list-table tr.repair{background:var(--yellow-soft);}
.list-table tr.paid{opacity:.55; text-decoration:line-through;}
.table-wrap{overflow:auto; border-radius:14px; border:1px solid var(--line);}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s; z-index:99; box-shadow:var(--shadow);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

.mini-btn{padding:6px 10px; border-radius:8px; font-size:11.5px; font-weight:700;}
.mini-btn.paid{background:var(--green-soft); color:var(--green);}
.mini-btn.del{background:var(--red-soft); color:var(--red);}
.empty-state{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.filters select, .filters input{padding:9px 12px; border-radius:10px; border:1.5px solid var(--line); font-size:12.5px; background:#F8FAFF;}
.actions-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
h2.page-title{font-size:16px; font-weight:800; color:var(--blue-deep); margin-bottom:14px;}
label.small{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:6px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-badge">S6</div>
    <h1>به پنل مدیریت بلوک S6 خوش آمدید</h1>
    <p class="sub">برای ورود، نام کاربری و رمز عبور خود را وارد کنید</p>
    <div class="field">
      <label>نام کاربری</label>
      <input id="loginUser" type="text" autocomplete="off">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input id="loginPass" type="password" autocomplete="off">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">ورود</button>
    <div class="login-error" id="loginErr"></div>
    <button class="btn-ghost" onclick="toggleCredPanel()">تغییر نام کاربری / رمز عبور</button>

    <div class="cred-panel" id="credPanel">
      <div class="field"><label>نام کاربری فعلی</label><input id="curUser" type="text"></div>
      <div class="field"><label>رمز عبور فعلی</label><input id="curPass" type="password"></div>
      <div class="field"><label>نام کاربری جدید (اختیاری)</label><input id="newUser" type="text"></div>
      <div class="field"><label>رمز عبور جدید (اختیاری)</label><input id="newPass" type="password"></div>
      <button class="btn btn-primary" onclick="changeCreds()">ذخیره تغییرات</button>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div>
      <div class="title">پنل مدیریت بلوک S6</div>
      <div class="date" id="todayJalali"></div>
    </div>
    <button class="hamburger" onclick="openDrawer()"><span></span><span></span><span></span></button>
  </div>

  <div class="page" id="pageContent"></div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dhead">
    <span class="lbl">منوی مدیریت</span>
    <button class="close-x" onclick="closeDrawer()">✕</button>
  </div>
  <button class="menu-item" onclick="go('dashboard')"><span class="ic">🏠</span> داشبورد</button>
  <button class="menu-item" onclick="go('units')"><span class="ic">🏢</span> ثبت واحدها</button>
  <button class="menu-item" onclick="go('txn')"><span class="ic">💳</span> ثبت بدهی / واریزی</button>
  <button class="menu-item" onclick="go('bulk')"><span class="ic">📢</span> ثبت شارژ گروهی</button>
  <button class="menu-item" onclick="go('sync')"><span class="ic">🔄</span> همگام‌سازی موجودی صندوق</button>
  <button class="menu-item" onclick="go('reports')"><span class="ic">📊</span> گزارش‌گیری</button>
  <button class="menu-item" onclick="go('editdebt')"><span class="ic">✏️</span> ویرایش بدهی</button>
  <button class="menu-item" onclick="go('future')"><span class="ic">🗓️</span> برنامه‌های آینده</button>
  <button class="menu-item danger" onclick="secureLogout()"><span class="ic">🔒</span> بستن امن برنامه</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
